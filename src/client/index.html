<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Interne Bewertungsplattform für die Mai-Ausflüge – nur mit Einladung."
    />
    <title>Maiausfluginator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23faf8f5'/%3E%3Cg fill='none' stroke='%231c5c47' stroke-width='1.4' stroke-linejoin='round'%3E%3Cpath d='M12 4 19 8v8l-7 4-7-4V8z'/%3E%3Cpath d='M5 8l7 4 7-4M12 12v8'/%3E%3C/g%3E%3C/svg%3E" />
    <!--
      Fraunces lives here rather than in styles.css on purpose.

      Bun's bundler rewrites every url() it finds in a stylesheet, and for a
      woff2 that means inlining it as a data URI — which buries 300 KB of base64
      inside the render-blocking stylesheet, defeats unicode-range (both subsets
      get downloaded whether or not a page needs them) and makes font-display
      meaningless. An inline <style> is left alone, so the files stay files,
      served by the /fonts route in src/server/index.ts.

      The happy side effect: declaring the face here means the browser starts
      fetching the serif while the stylesheet is still in flight.
    -->
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/fraunces-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/fraunces-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Der Maiausfluginator braucht JavaScript.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
